<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Web Application</title>
</head>
<body>
    <h1>team vs team</h1>
    
    <form action="team_vs_team",method = 'get'>
        
        <label>select team 1</label>
        <select name="team1">
            {% for item in teams %}
            <option>{{ item }}</option>
            {%endfor%}
            
            
        </select><br><br>
        <label>select team 2</label>
        <select name="team2">
            {% for item in teams %}
            <option>{{ item }}</option>
            {%endfor%}
        </select><br><br> 

        <input type = "submit" value = 'Find Track record'>
    </form>
    {% if result %}
        {% for i in result %}
            <p>{{ i }} : {{ result[i] }}</p>
        {% endfor %}
    {% endif %}


</body>
</html>
